author: "mypingishuge"
delete-after: True
changes:
  - rscadd: "(CadenzaHyposelenia, Ketrai, Slav-ie) Added ear- and horn-slot headwings, two Fennec ear options, two Raccoon tails, and Reckless Alt hair."
  - rscadd: "(Randumb-Phantomb, Ketrai) Added more Race Titles for Wild-Kin and Critterkin, including Raccoon titles where available."
  - rscadd: "(Kaolin1234) Dark Elves can choose the Weaver spider body. Its updated sprites keep bare hands visible."
  - rscadd: "(Kroto-Ker) Added Corpulent and the Plump belly option. Hunger lowers Speed by 2 and halves stamina recovery. Twelve bites sate the vice, with good food counting double. Winded characters with the vice can audibly pant, and Pant is available in the Noises menu."
  - bugfix: "(Xander3359) Bad Eyesight puts starting spectacles in the stash so equipped facewear stays in place."
  - qol: "(Xander3359) Borrowed Redolent scents can coexist and expire separately. Fresh exposure renews that scent. Washing clears borrowed scents and keeps your personal scent."
  - balance: "(AlucardHellsingChapel, SirSwagmeyer) Adventurer Duelists gain +2 Speed instead of +1. Hedge Knight Speed is capped at 11."
  - balance: "(SirSwagmeyer) Nightmasters and Bath Attendants cannot take the four crafting apprentice virtues."
  - balance: "(ceeetchell) Black Oak Pariahs start with hardened leather pants and bracers. Elven boots and gloves now have leather armor protection, hardened leather durability, and sewing repairs."
  - bugfix: "(Gug1234) Unarmed Lunacy Embracers start with monk bracers they can wear."
  - balance: "(Ripperserk) Vicious leggings count as medium armor."
  - rscadd: "(acssination, ariaworld) Rapiers gain the dagger punch. Training dummies teach Unarmed up to Apprentice."
  - bugfix: "(CentralSmith) Dipped daggers deliver poison on eligible damaging blade strikes. Misses, defended hits, fully blocked hits, and punches leave the coating unused."
  - bugfix: "(CentralSmith) Silver melee hits can sunder silver-weak creatures, including NPCs, when the hit deals damage. Quietus stays on the weapon when the target has no reagent holder."
  - balance: "(ariaworld) Player deadites rise with 16–18 Strength and keep breath immunity. Leaving the deadite form removes its Strength modifier."
  - rscadd: "(ophaq) Spellsingers can conjure an instrument. Conjuring another replaces the current one."
  - balance: "(AlucardHellsingChapel) Shadowstep can be cast without a Naledi mask."
  - balance: "(Xander3359, SirSwagmeyer) Sylphs fire weaker frostbolts in volleys with a six-second cooldown. Kneestingers created by Sylphs and Pioneer traps grow in and fade away."
  - balance: "(SirSwagmeyer) Poison Gas drains stamina and removes medicine instead of dealing toxin damage."
  - bugfix: "(Arturlang) Lickers drop their extra silver weakness. Vampire conversion respects immunity, clan action icons load correctly, and rejected gifts stay with the giver."
  - bugfix: "(Arturlang, wikimody) Lifting a curse restores the penalty that curse actually applied and leaves other sources of the same trait intact. Divine curses on Lux Abominations expire after 30 minutes."
  - admin: "(Arturlang) Admins can choose which divine curse to apply or lift."
  - rscadd: "(vii-the-chariot) Ravox’s Vow grants Willpower and gradually heals wounds."
  - qol: "(wikimody) Lux can revive excommunicated patients who meet its other requirements."
  - bugfix: "(CentralSmith) Only an accepted prayer starts the one-minute cooldown, and early attempts show the remaining time. Martyrs get a recovery alert and separate healing for their own and received prayers. Inhumen prayers do not grant received-prayer healing."
  - qol: "(Kaolin1234) Diagnose and Secular Diagnosis report missing organs and account for organs in a Dullahan’s detached head."
  - bugfix: "(Kaolin1234) Resting or warming up by a fire leaves surgical incisions open."
  - balance: "(wikimody) Cauteries can heat themselves with stored fuel. Fibers, thorns, sticks, and coal dust replenish it. Cauteries stay hot longer and fire dust extends the heat further."
  - balance: "(wikimody) Skilled cauterization burns less and a fumble can cause severe burns. Master or better Medicine lets you cauterize through clothing while the patient is out of combat mode."
  - qol: "(remuluson2, Kaolin1234) Sneak-click a bedroll to hide underneath without folding it. Scrappers and rag-pickers empty at the keyholder’s feet."
  - bugfix: "(ronfino) Use Sneak to smelt tongs. Ancient tongs replace the duplicate decrepit version in smithing, loadouts, and Wretchfort."
  - qol: "(ronfino) Empty pouches use their empty sprite."
  - balance: "(annikaRU) Golem Skill Exhibitors and gas belcher shells require bronze cogs. The cannon’s extra materials are two steel bars, two bronze cogs, and two small logs. Cooling tables and autogrinders salvage bronze cogs."
  - sound: "(trueroguan) Ambient and combat music stream, and combat music plays forward during Druqks."
  - code_imp: "(Kroto-Ker) Reuses cached sprites when drawing organ overlays."
  - admin: "(ronfino, IronDragoon) Renamed the GameMaster tab and simplified admin verb labels. The Letter Panel archives letters and parcels, lists spawned parcel contents, and routes named mail to the selected player when character names match."
  - image: "(AlucardHellsingChapel) Restored Baothan light plate art."
  - qol: "(UntoldTactics, SirSwagmeyer) Updated Baotha and Psydon lore, the Ferentian Calendar, and Fleshcraft’s in-world roleplay guidance."