author: "mypingishuge"
delete-after: True
changes:
  - rscadd: "(Gug1234) Added adjustable cloth, leather and mail masks, aventails, steel barbutes and plumes, gilded armor, and plate-and-maille crafting."
  - rscadd: "(Gug1234, IronDragoon) Expanded Silverface armor stock and helmet choices for knights and Black Oaks. Wardens and matching retainers can use the Rous-skull helm."
  - rscadd: "(Guidesu) Added clothing from Azure Peak and Twilight Axis, including new shoes, hats, masks, cloaks and shirts."
  - bugfix: "(Guidesu, Randumb-Phantomb) Fixed hat storage and bracer and cloak layering. The aventailed hounskull hides snouts, and cat ears and feminine curly hair render consistently across facings."
  - balance: "(Gug1234) Silver critical hits build Sunder stacks instead of relying on an immediate kill. Updated Inquisition relic balance, including Eucharist and the relic flail."
  - rscadd: "(Hyenh, MrShibaa) Added the silver tanto, kodachi and ssangsudo, steel and western Nodachis, and a role-issued Nodachi sheath."
  - balance: "(eirenxiv) Hangyaku-Kouken can choose Ssangsudo and Bow together and use heavy Samsibsa brigandine."
  - balance: "(wikimody) Two Pioneer slots are available. Pioneers gain stronger crafting, improved building supplies and a demolition pick intent on the Saperka. Pioneer and Skirmisher trap behavior has changed."
  - balance: "(SirSwagmeyer, spacemanfromspacestation-prog) Adjusted Wretch and Bandit subclasses, Ferentian melee mercenary choices, and Zizo's existing Profane miracle."
  - rscdel: "(SirSwagmeyer) Removed Marauder from Wretch selection."
  - rscadd: "(AlucardHellsingChapel) Added Vicious heavy armor, the Vicious Tomahawk and Targe, and new Graggar armament options."
  - rscadd: "(AlucardHellsingChapel) Added Roar of the Gorebound Star, Berserk Body and Avatar of Rage. Updated Bloodrush and Break the Ranks."
  - rscdel: "(AlucardHellsingChapel) Removed Motive from Graggarite Lux plate."
  - rscadd: "(wikimody) Keepers can research and craft organs and limbs through the Heartbeast."
  - rscadd: "(wikimody, MrShibaa) DEFY lets Psydonites stand and act briefly when near death. Court Chaplains can follow Psydon and receive the miracle."
  - rscadd: "(Arturlang) Vampires can enter torpor voluntarily or after lethal injury. Coffins and graves speed recovery. Staking or Embrace Necra can end it permanently."
  - bugfix: "(Arturlang) Living characters can resist out of graves. Silver fire blocks vampire mending while it is actively burning."
  - image: "(IronDragoon) Updated antagonist HUD icons for vampires and added icons for bandits, deadites, werewolves, skeletons and liches."
  - bugfix: "(wikimody) Cure Rot can cure a deadite without killing them. It is harder to make."
  - image: "(DelineFortune) Updated the sprites on several church quest tokens."
  - balance: "(wikimody) Admonishment removes curses for Absolvers and transfers them to Stigmata when they perform it. Psydonite conversion still clears apostasy and excommunication."
  - rscadd: "(wikimody) Added Bestow for Absolvers and Stigmata to manage their own Lux. Updated their equipment and Lux-extraction protections."
  - bugfix: "(wikimody) Absolution gives feedback to the person it heals when treating an Inquisition member."
  - rscadd: "(Guidesu) Added Baker's Root and its cooking and brewing recipes."
  - rscadd: "(Guidesu) Added wooden campfire spits, leather tent walls and flaps, and loadout bedrolls and small tent kits."
  - qol: "(Guidesu) Use tree stumps as work surfaces. Build tent pieces on open ground or dismantle them with a stake from the side where they were built."
  - balance: "(Guidesu) Reduced the material cost of small tent, ger and yurt kits."
  - bugfix: "(Guidesu) Dismantling tent walls cleans up leftover flooring."
  - rscadd: "(Useroth) Wield a scythe and use Reap to harvest ripe plants in a three-by-two area."
  - rscadd: "(CentralSmith) Sealed brewer's bottles have their own Navigator export category with separate demand and saturation."
  - map: "(WitchLilly) Updated the keep, manor and nearby areas on the original Dun World map."
  - rscadd: "(hugmeorelse) Edit character and gnoll galleries, frame chat headshots, swap alternate image URLs, and resize or reorder gallery images."
  - admin: "(hugmeorelse, IronDragoon) Added original headshot viewing and framing logs, as well as forensics, AFK management and preference refresh tools."
  - rscadd: "(Kaolin1234) Rotate with Pixel Shift using your hand-selection bindings. Pose a grabbed character with your active hand empty, or use the optional rotation reset."
  - qol: "(Kaolin1234) Player mounts can allow rider steering. Riders stay attached on jumps and climbs, and the mount can release them with Dismount Rider."
  - balance: "(Kaolin1234) Riding a player mount neither uses nor grants Riding XP. Knockdowns can dismount riders."
  - qol: "(IronDragoon) Send HERMES mail directly to Kingsfield. Admins get a notification and can still read a saved copy after the original is gone."
  - bugfix: "(IronDragoon) HERMES deliveries preserve apostrophes in character names."
  - sound: "(hugmeorelse) Added positional point ambience, continuous river sound, smoother fades, sound occlusion and revised distance falloff."
  - sound: "(hugmeorelse) Updated instruments, music boxes and other looping sounds. Fixed sound settings carrying between listeners and several loop startup and cleanup issues."
  - bugfix: "(hugmeorelse) Repaired windowed doors keep their transparency."
  - qol: "(hugmeorelse) Audio Settings separates Master, Instruments, Point Ambience, admin sounds and streamed audio. Adjust Point Ambience independently."
  - admin: "(hugmeorelse) Added live audio diagnostics and point ambience controls."
  - config: "(hugmeorelse) Added documented sound and point ambience settings."
  - server: "(Arturlang) BYOND 516 is required to compile. CI now checks for missing DME and test includes."