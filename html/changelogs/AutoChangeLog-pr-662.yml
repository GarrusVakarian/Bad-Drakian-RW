author: "mypingishuge"
delete-after: True
changes:
  - qol: "Examining a handcart shows its installed upgrade."
  - bugfix: "The EA Hasir-ian merchant’s handcart now appears at their caravan spawn."
  - rscadd: "Steel, iron, and Oathmarked Lucernes gain Backstep."
  - qol: "Peddlers and peddler carts support bulk buying, stocking, and unloading in a new shop window."
  - bugfix: "Broken peddler carts drop stored Mammon and sales proceeds."
  - bugfix: "Quenched items no longer disappear due to out-of-range quality."
  - bugfix: "Dwarvish Knowledge works for needle and hammer repairs."
  - bugfix: "Kabuto and Jingasa both appear in smithing recipes."
  - bugfix: "Incapacitated NPC deadites cannot bite, and net stat penalties end when the net comes off."
  - bugfix: "Fencing shirts and jackets render correctly on feminine bodies. Footwear can be snipped, and boot salvage returns any stowed tools."
  - rscadd: "Arachnids can select Crocs Cavalier, Crocs Assassin, and the Drow Adventurer subclass."
  - bugfix: "Retainers can switch to the garrison SCOM line."
  - bugfix: "The Adjudicator Executioner keeps their starting shield."
  - rscadd: "Short elf ears are available, and Half-Elves can choose no ears."
  - rscadd: "The Spellsinger Robe and bronze wedding band are available in loadouts."