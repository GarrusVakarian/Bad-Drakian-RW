      return the ingredients and leave the water in the pot.
  - qol: Pots can cook several batches at once if there is enough water.
  - qol: Hearth and campfire pots announce when the final batch is ready and there
      is too little water left to cook another.
  - bugfix: Sort protective loadout wearables under Armor and move unprotective garments
      to their clothing categories.
  - rscadd: Added a Cost only filter to the loadout menu.
