author: "mypingishuge"
delete-after: True
changes:
  - balance: "Stat drain starts with a warning, leaves Fortune alone, and wears off 15 minutes after the last qualifying cycle."
  - rscadd: "Erotic Energy Drainer is a one-point alternative to Erotic Drainer that absorbs energy, costing one quirk point."
  - qol: "Choose how many points you can lose from each stat under Erotic Stat and Energy Drain, in the toggle settings."
  - qol: "Lowering your stat drain limit restores any excess stat loss immediately."
  - qol: "Stat drain tells the drainer when it starts and both players when a stat drops or the cap blocks a drop."
  - qol: "Choose Energy drain or Stat drain as your innate Gnoll quirk in the toggle settings."
  - qol: "One opt-in toggle setting covers both drains. Turning it off clears active stat drain."
  - qol: "Content Toggles shows NEW again for returning players."