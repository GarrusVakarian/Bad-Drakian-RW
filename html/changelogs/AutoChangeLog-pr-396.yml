author: "mypingishuge"
delete-after: True
changes:
  - qol: "Getting Started now explains how to light torches and lampterns and clarifies how to access backpacks."
  - qol: "Familiars can adjust their darkness visibility with Nighteyes."
  - qol: "Javelins can now be twirled using Polearms skill."
  - qol: "Hypnotic Gaze and Presence descriptions explain where to customize their examine text."
  - rscadd: "Added Amphibious, a 1-QP quirk that allows breathing underwater."
  - qol: "Pouches can be equipped in either back slot or the bracer slot."
  - qol: "Metal armor movement clanging now plays every twelve steps instead of four."